<!DOCTYPE html>

  <title>The Only 7 Books You Need to Educate Yourself Like the Top 1% — 金句 Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #f0f0f0;
      font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }
    header {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    header h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.8rem;
      color: #f9d342;
    }
    header .meta {
      font-size: 0.9rem;
      opacity: 0.7;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    header .meta a {
      color: #a8d8ea;
      text-decoration: none;
    }
    header .meta a:hover { text-decoration: underline; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card img {
      width: 100%;
      display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .card-body {
      padding: 1rem 1.2rem;
    }
    .card-body .timecode {
      font-size: 0.75rem;
      color: #a8d8ea;
      margin-bottom: 0.5rem;
      font-family: monospace;
    }
    .card-body .quote {
      font-size: 0.88rem;
      line-height: 1.75;
      color: #e8e8e8;
    }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.78rem;
      opacity: 0.45;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>The Only 7 Books You Need to Educate Yourself Like the Top 1%</h1>
    <div class="meta">
      <a href="https://youtu.be/Q0pAWZiV2GU" target="_blank" rel="noopener">▶ 觀看原片</a>
      <span>字幕：680 條（en→zh-TW）</span>
      <span>金句：12 句</span>
      <span>語言：English → 繁體中文</span>
    </div>
  </header>

  <div class="grid" id="gallery"></div>

  <footer>Generated by OpenClaw · Trend Scout · 2026-03-22</footer>

  <script>
    const VID = "Q0pAWZiV2GU";
    const quotes = [
      {n:1, sec:2, img:"quote_01.jpg", tgt:"大多數人讀書是為了變得更聰明，他們學到更多資訊，但生活卻一成不變。然而有少數幾本書會讓你「危險地聰明」——它們重新連接你的大腦，改變你的思維、決策方式，以及你看見別人看不見的東西。"},
      {n:2, sec:46, img:"quote_02.jpg", tgt:"在決定讀一本書之前，先問三個問題——我稱之為「三道關卡」。第一道：這本書會改變你「思考的方式」，還是只改變你「思考的內容」？能裝入新的心智工具的書，才能帶來真正的系統升級。"},
      {n:3, sec:80, img:"quote_03.jpg", tgt:"最好的書不是來確認你已知的事，而是一頁一頁、永久地拆解掉你以為確信的一切。如果你讀完一本書，感覺自己的想法獲得了印證，那你其實什麼新東西都沒學到。"},
      {n:4, sec:145, img:"quote_04.jpg", tgt:"塔雷伯在《被隨機性愚弄》中揭示：隨機性會製造天才。一萬名交易員擲硬幣，五年後必然有312人每次都猜對，他們會登上《富比士》封面、出書、開頻道。但他們是真正的高手嗎？不，他們只是統計上的必然產物。"},
      {n:5, sec:196, img:"quote_05.jpg", tgt:"塔雷伯的論點令人不寒而慄：單憑過去的成績紀錄，你根本無法區分一個真正的高手和一個幸運的笨蛋。成功的外表可能只是隨機性的產物，我們卻習慣把它詮釋成能力與遠見。"},
      {n:6, sec:254, img:"quote_06.jpg", tgt:"停止試圖成為更準確的未來預測者，開始試圖讓自己變得更不脆弱、對隨機性更具韌性。我們無法準確預測未來，但可以建構一個即使在不確定性中也能存活甚至受益的自己。"},
      {n:7, sec:336, img:"quote_07.jpg", tgt:"你愈聰明，就愈難改變自己的想法。研究人員給新手學生和資深會計師相同稅法問題，當規則稍微改變後，專家的犯錯率竟然是學生的三倍——因為專家太確信自己是對的。知道得愈多，反而看得愈少。"},
      {n:8, sec:364, img:"quote_08.jpg", tgt:"柯達發明了數位攝影，有技術、有人才、有資源——但他們把它封存了，因為威脅到底片業務。百視達曾有機會以5000萬美元買下Netflix，但拒絕了。這些高層並不笨，他們只是試圖保護昨天的勝利，卻把自己關進了「專業監獄」。"},
      {n:9, sec:428, img:"quote_09.jpg", tgt:"英特爾稱霸電腦晶片市場數十年，但因忙著保護既有版圖，完全忽視了GPU革命的崛起。如今英特爾市值約2200億美元，而輝達已是一個4兆美元的生態系。這就是「創新者的兩難」所說的那個故事。"},
      {n:10, sec:514, img:"quote_10.jpg", tgt:"Annie Duke在《用賭注思考》中說：把每個決定都當成一次下注。從孟買赴波士頓讀碩士時，我的獎學金有條件——第一學期自費，撐過去才補助其餘費用。我用下注思維面對：列出強項弱點、盤點可能出錯的環節，然後計算我的勝算。"},
      {n:11, sec:665, img:"quote_11.jpg", tgt:"如果你的智慧本身就是陷阱，那怎麼辦？《智慧陷阱》揭示了聰明人特有的失敗模式：他們能把任何事情合理化，成為自己最好的辯護律師。一般人碰壁時反省自己；聰明人碰壁時，則質疑那面牆。"},
      {n:12, sec:766, img:"quote_12.jpg", tgt:"禪宗有個概念叫「初心」（Shoshin）。專家的杯子永遠是滿的，裝不下任何新的東西；而初學者的杯子永遠是空的，時刻準備好接納一切。真正的學習，始於承認自己的杯子並不是全滿的。"},
    ];

    const toTC = s => {
      const m = Math.floor(s/60).toString().padStart(2,'0');
      const sec = (s%60).toString().padStart(2,'0');
      return `${m}:${sec}`;
    };

    const gallery = document.getElementById('gallery');
    quotes.forEach(q => {
      const ytUrl = `https://youtu.be/${VID}?t=${q.sec}`;
      gallery.innerHTML += `
        <div class="card">
          <a href="${ytUrl}" target="_blank" rel="noopener">
            <img src="${q.img}" alt="quote ${q.n}" loading="lazy" />
            <div class="card-body">
              <div class="timecode">⏱ ${toTC(q.sec)}</div>
              <div class="quote">${q.tgt}</div>
            </div>
          </a>
        </div>`;
    });
  </script>
</body>
</html>
