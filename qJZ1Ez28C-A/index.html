<script>
const quotes = [
  {n:1, yt:0, img:"quote_01.jpg", tgt:"身為一個花了大半輩子研究物理的 42 歲人，我必須承認自己過去有一個根深柢固的誤解——我以為每個物體在空間中只有一條單一的軌跡，一條固定的路徑。但在這支影片中，我將向你證明事實並非如此。萬物其實同時探索著所有可能的路徑。", tc:"00:00:00"},
  {n:2, yt:68, img:"quote_02.jpg", tgt:"你或許認識這個數學關係式，因為它正是描述光從一種介質進入另一種介質時所遵循的定律——光也會選擇從 A 到 B 最快的路徑。奇怪的是：我們人類可以看見目的地，然後規劃最快的路線；但光呢？光怎麼知道該如何行進才能將旅行時間最小化？", tc:"00:01:08"},
  {n:3, yt:131, img:"quote_03.jpg", tgt:"現在我要向你證明：光並非只朝一個方向出發，它確實探索著所有可能的路徑。電子、質子以及所有量子粒子亦是如此。因此，我們看到物體沿著單一、明確軌跡運動這件事，某種程度上是自然界所設計出最具說服力的幻覺。", tc:"00:02:11"},
  {n:4, yt:390, img:"quote_04.jpg", tgt:"在較短波長的情況下，古典理論的預測與實驗數據嚴重偏離。事實上，理論預測在最短波長處會釋放出無窮大的能量。這個顯而易見的荒謬結論，因此被稱為「紫外線災難」——古典物理學在此徹底崩潰。", tc:"00:06:30"},
  {n:5, yt:455, img:"quote_05.jpg", tgt:"普朗克說，他已準備好犧牲自己對物理定律的一切既有信念。然後，他做了一件他自稱是「絕望之舉」的事，一個前所未有的嘗試。古典物理認為波的能量可以取任意值；但普朗克試著限制能量，使它只能以最小單位的整數倍出現——那個最小單位就是「量子」，而且他讓一個量子的能量與其頻率成正比：E = hf。", tc:"00:07:35"},
  {n:6, yt:584, img:"quote_06.jpg", tgt:"普朗克被自己的公式所困擾，因為對他而言那不過是一個數學技巧。他完全不知道為何有效——那純粹是形式上的操作。更重要的是，他根本不知道常數 h 代表什麼。他在毫無理論依據的情況下引入了一個全新的物理常數。他寫道：「必須不惜一切代價找到理論上的解釋。」", tc:"00:09:44"},
  {n:7, yt:671, img:"quote_07.jpg", tgt:"1905 年，愛因斯坦主張普朗克的理論不只是數學技巧，而是在告訴我們：光真的是由離散的能量包所構成，也就是光子，每個光子帶有能量 hf。愛因斯坦用這個洞見解釋了光電效應——光能讓金屬釋放電子，但前提是頻率要夠高；若頻率太低，無論光有多強，都無法釋放任何電子。", tc:"00:11:11"},
  {n:8, yt:815, img:"quote_08.jpg", tgt:"為了完成博士論文，路易·德布羅意提出了一個關鍵洞見：如果光可以同時是波也是粒子，那麼物質粒子是否也可以是波？他提出，萬物——電子、籃球、人，絕對的一切——都擁有波長，其定義為普朗克常數除以粒子的動量（即質量乘以速度）。", tc:"00:13:35"},
  {n:9, yt:891, img:"quote_09.jpg", tgt:"現在我們終於有了角動量為何是量子化的充分物理原因：因為電子是波，而要被束縛在原子內，它必須以駐波的形式存在，形成建設性干涉才能有穩定的軌道。正是量子物體的這種波動性，意味著它們不再擁有一條單一的空間路徑，而是必須同時探索所有可能的路徑。", tc:"00:14:51"},
  {n:10, yt:1061, img:"quote_10.jpg", tgt:"據說那位學生就是理查·費曼，儘管這個故事是虛構的，但其邏輯無懈可擊。如果你相信雙縫實驗——粒子穿過哪條縫是無法確定的，那你就必須接受它同時穿過兩條縫的可能性。同樣的邏輯意味著：任何時候粒子從甲地移動到乙地，你都必須考慮所有可能的路徑，包括比光速還快的路徑、逆時間行進的路徑，乃至繞到月球另一側再回來的路徑。", tc:"00:17:41"},
  {n:11, yt:1407, img:"quote_11.jpg", tgt:"那正是古典的作用量。因此，決定量子「碼表」轉速的是作用量：粒子沿著路徑前進時，作用量增加，相位也隨之改變。約化普朗克常數 ℏ 極其微小——大約 10 的負 34 次方焦耳秒——遠遠小於任何日常物體的作用量。這意味著普通路徑的相位會旋轉無數圈，幾乎所有路徑的貢獻都因相位不對齊而相互抵消，形成破壞性干涉。唯一的例外是最接近最小作用量路徑的那些路徑——它們相位相近、建設性干涉相互增強，這就是我們最終觀測到的路徑。", tc:"00:23:27"},
  {n:12, yt:1523, img:"quote_12.jpg", tgt:"這正是古典力學如何從量子力學中湧現的原因。這解釋了為什麼球會走它走的軌跡、行星為什麼這樣繞太陽公轉。它們其實並沒有精確的軌跡——一切都在探索所有可能的路徑。只不過大質量物體的作用量遠大於 ℏ，使得只有極靠近最小作用量路徑的那些路徑能夠存活下來。", tc:"00:25:23"},
  {n:13, yt:1929, img:"quote_13.jpg", tgt:"一旦你理解這個底層原理，物理就變得容易多了：你只需要寫下正確的拉格朗日量，得到正確的作用量，物理定律就自然浮現。人們追求的「萬物理論」——那個能涵蓋所有物理的終極理論——本質上問的正是：哪個拉格朗日量能推導出這個宇宙中所有的物理定律？這才是物理學家真正在尋找的東西。", tc:"00:32:09"}
