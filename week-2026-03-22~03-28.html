<style>
  :root {
    --brand: #7BB4B8;
    --brand-dark: #5a9499;
    --brand-light: #e8f4f5;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a2332;
    --text-secondary: #6b7585;
    --up: #2ecc71;
    --down: #e74c3c;
    --tab-active: #7BB4B8;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }

  /* Header */
  .header {
    background: var(--brand);
    padding: 24px 32px;
    color: white;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header .period { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .header .badge {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    font-weight: 600;
  }

  /* Tabs */
  .tabs-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .tabs {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 0;
  }
  .tab {
    padding: 14px 24px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
  }
  .tab:hover { color: var(--brand); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  /* Content */
  .content { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  .section { display: none; }
  .section.active { display: block; }

  /* KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 640px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .kpi-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .kpi-value { font-size: 28px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -1px; color: var(--text); }
  .kpi-delta {
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .kpi-delta.up { color: var(--up); }
  .kpi-delta.down { color: var(--down); }

  /* Chart card */
  .chart-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .chart-title { font-size: 15px; font-weight: 700; }
  .chart-toggle { display: flex; gap: 6px; }
  .toggle-btn {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.15s;
  }
  .toggle-btn.active {
    background: var(--brand);
    border-color: var(--brand);
    color: white;
  }
  .chart-container { position: relative; height: 260px; }

  /* Two col layout */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
  .donut-container { position: relative; height: 220px; }

  /* Source list */
  .source-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .source-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .source-rank {
    width: 20px;
    text-align: right;
    color: var(--text-secondary);
    font-size: 11px;
    flex-shrink: 0;
  }
  .source-name { flex: 1; color: var(--text); font-weight: 500; }
  .source-bar-wrap { width: 80px; background: var(--bg); border-radius: 4px; height: 6px; flex-shrink: 0; }
  .source-bar { height: 6px; border-radius: 4px; background: var(--brand); }
  .source-val { width: 60px; text-align: right; color: var(--text-secondary); font-size: 12px; flex-shrink: 0; }

  /* Articles */
  .articles-table { width: 100%; border-collapse: collapse; }
  .articles-table thead th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    border-bottom: 2px solid var(--border);
    font-weight: 600;
  }
  .articles-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .articles-table tbody tr:last-child { border-bottom: none; }
  .articles-table tbody tr:hover { background: var(--brand-light); }
  .articles-table td { padding: 10px 12px; vertical-align: middle; }
  .art-rank { color: var(--text-secondary); font-size: 12px; text-align: center; width: 32px; }
  .art-title { font-size: 13px; line-height: 1.4; color: var(--text); }
  .art-pv { text-align: right; font-weight: 700; font-size: 13px; color: var(--brand-dark); white-space: nowrap; }
  .art-pv-bar-wrap { width: 80px; }
  .art-pv-bar { height: 5px; background: var(--brand); border-radius: 3px; opacity: 0.6; }

  /* Utility */
  .section-sub-title { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
</style>
</head>

      {title:"台湾鉄道の特急「プユマ号」、塗装変更へ",pv:2717},
      {title:"台湾高速鉄道、通信品質向上へ　約100億円投入",pv:2498},
      {title:"サッカー女子アジア杯　台湾、北朝鮮に敗れる",pv:2028},
      {title:"無差別襲撃の容疑者制止試み死亡の男性、忠烈祠に合祀",pv:2009},
      {title:"台湾プロ・味全、5月にソフトバンク応援ツアー",pv:1705},
      {title:"台北にホタル観賞の季節到来",pv:1658},
      {title:"台湾、不当表記に対抗　韓国を「KOREA（SOUTH）」に変更へ",pv:1571},
      {title:"屏東県、チガヤ植栽　ヒガシメンフクロウ絶滅防止へ",pv:1419},
      {title:"世界最強のパスポートランキング　台湾は31位",pv:1288},
      {title:"フードパンダ台湾事業を953億円で買収合意　グラブ",pv:1243},
      {title:"DAZN台湾、日本プロ野球800試合以上を生配信へ",pv:1195},
    ]
  }
};

const COLORS = ['#7BB4B8','#5a9499','#a8d0d3','#3d7478','#c8e5e7','#2c5659','#87bfc3','#4a8a8e','#b5d8db','#1e3b3d'];
const metricLabel = { users:'使用者', sessions:'工作階段', pageviews:'瀏覽量' };

const chartInstances = {};
const donutInstances = {};
const currentMetric = { cna:'users', ft_en:'users', ft_jp:'users' };

function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toLocaleString();
}
function fmtFull(n) { return n.toLocaleString(); }

function delta(curr, prev) {
  if (!prev) return null;
  return ((curr - prev) / prev * 100).toFixed(1);
}

function buildKPI(prop) {
  const d = DATA[prop];
  const curr = d.traffic.reduce((a,b)=>({users:a.users+b.users, sessions:a.sessions+b.sessions, pageviews:a.pageviews+b.pageviews}));
  const prev = d.prev.reduce((a,b)=>({users:a.users+b.users, sessions:a.sessions+b.sessions, pageviews:a.pageviews+b.pageviews}));
  const metrics = [
    {label:'週使用者', key:'users', icon:'👥'},
    {label:'週工作階段', key:'sessions', icon:'🔄'},
    {label:'週瀏覽量', key:'pageviews', icon:'📄'},
  ];
  const el = document.getElementById('kpi-'+prop);
  el.innerHTML = metrics.map(m => {
    const d_val = delta(curr[m.key], prev[m.key]);
    const isUp = d_val >= 0;
    return `<div class="kpi-card">
      <div class="kpi-label">${m.icon} ${m.label}</div>
      <div class="kpi-value">${fmt(curr[m.key])}</div>
      <span class="kpi-delta ${isUp?'up':'down'}">${isUp?'▲':'▼'} ${Math.abs(d_val)}% vs 上週</span>
    </div>`;
  }).join('');
}

function buildChart(prop) {
  const d = DATA[prop];
  const metric = currentMetric[prop];
  const labels = d.traffic.map(r => r.date);
  const thisWeek = d.traffic.map(r => r[metric]);
  const lastWeek = d.prev.map(r => r[metric]);
  const ctx = document.getElementById('chart-'+prop).getContext('2d');
  if (chartInstances[prop]) chartInstances[prop].destroy();
  chartInstances[prop] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '本週',
          data: thisWeek,
          borderColor: '#7BB4B8',
          backgroundColor: 'rgba(123,180,184,0.1)',
          borderWidth: 2.5,
          pointRadius: 4,
          pointBackgroundColor: '#7BB4B8',
          fill: true,
          tension: 0.3,
        },
        {
          label: '上週',
          data: lastWeek,
          borderColor: '#c5cdd8',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          pointRadius: 3,
          pointBackgroundColor: '#c5cdd8',
          fill: false,
          tension: 0.3,
          borderDash: [5,4],
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          labels: { font: { size: 12 }, usePointStyle: true, pointStyleWidth: 10 }
        },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtFull(ctx.raw)}`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          grid: { color: 'rgba(0,0,0,0.05)' },
          ticks: {
            callback: v => fmt(v),
            font: { size: 11 },
            color: '#8a93a3'
          }
        },
        x: {
          grid: { display: false },
          ticks: { font: { size: 12 }, color: '#8a93a3' }
        }
      }
    }
  });
}

function buildDonut(prop) {
  const sources = DATA[prop].sources.slice(0, 10);
  const ctx = document.getElementById('donut-'+prop).getContext('2d');
  if (donutInstances[prop]) donutInstances[prop].destroy();
  donutInstances[prop] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: sources.map(s => s.name),
      datasets: [{
        data: sources.map(s => s.users),
        backgroundColor: COLORS,
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.label}: ${fmtFull(ctx.raw)} 人`
          }
        }
      },
      cutout: '62%'
    }
  });

  // Source list
  const max = sources[0].users;
  const listEl = document.getElementById('srclist-'+prop);
  listEl.innerHTML = sources.map((s, i) => `
    <div class="source-row">
      <span class="source-rank">${i+1}</span>
      <span class="source-name">${s.name}</span>
      <div class="source-bar-wrap"><div class="source-bar" style="width:${Math.round(s.users/max*100)}%;background:${COLORS[i]}"></div></div>
      <span class="source-val">${fmt(s.users)}</span>
    </div>
  `).join('');
}

function buildArticles(prop) {
  const arts = DATA[prop].articles;
  const maxPv = arts[0].pv;
  const tbody = document.getElementById('arttable-'+prop);
  tbody.innerHTML = arts.map((a, i) => `
    <tr>
      <td class="art-rank">${i+1}</td>
      <td class="art-title">${a.title}</td>
      <td class="art-pv">${fmtFull(a.pv)}</td>
      <td class="art-pv-bar-wrap"><div class="art-pv-bar" style="width:${Math.round(a.pv/maxPv*100)}%"></div></td>
    </tr>
  `).join('');
}

function switchTab(prop, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+prop).classList.add('active');
  // Trigger chart resize
  setTimeout(() => {
    if (chartInstances[prop]) chartInstances[prop].resize();
    if (donutInstances[prop]) donutInstances[prop].resize();
  }, 50);
}

function switchMetric(prop, metric, el) {
  el.closest('.chart-toggle').querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentMetric[prop] = metric;
  buildChart(prop);
}

// Init all
['cna','ft_en','ft_jp'].forEach(prop => {
  buildKPI(prop);
  buildChart(prop);
  buildDonut(prop);
  buildArticles(prop);
});
</script>
