    const quotes = [
      {n:"01", tc:"00:00:04", s:4, text:"日本高等專門學校（高專）的求人倍率，竟然高達一般水準的20倍之多。在科技產業人才爭搶激烈的現在，企業競相搶奪高專畢業生，為什麼高專人才會在現在突然掀起這一波熱潮？這是許多人想了解的核心問題。"},
      {n:"02", tc:"00:00:13", s:13, text:"IT企業或顧問公司等，原本幾乎不招募高專畢業生的企業，現在也開始積極投入採用行列。這些新加入競爭的企業大幅拉高了整體招募熱度，讓高專人才的爭搶戰況愈演愈烈，整個就業市場呈現前所未有的高溫狀態。"},
      {n:"03", tc:"00:02:15", s:135, text:"高專學生從15歲就開始接受專業技術訓練，加上課程中有非常多實驗與實習的機會，培養出扎實的「動手做」能力。這種從基礎就紮根的實作力，正是企業最看重、也是高專畢業生最核心的競爭優勢所在。"},
      {n:"04", tc:"00:02:58", s:178, text:"在「Physical AI（實體AI）」日益受到重視的當下，高專本來就在機器人等硬體領域有深厚底蘊，同時又具備AI開發能力。這種軟硬兼備的複合型人才特性，讓高專很可能成為下一波Physical AI時代最重要的人才搖籃。"},
      {n:"05", tc:"00:04:33", s:273, text:"AI技術日新月異，連一個學期開始時規劃好的課程，到了學期中途就可能已經落伍。為了解決這個困境，富山高專採用產學合作模式，引入來自業界第一線的真實AI技術與社會應用知識，讓課程內容隨時保持在最前沿。"},
      {n:"06", tc:"00:05:12", s:312, text:"富山高專邀請目前仍在企業第一線實際推動AI社會應用的從業人員擔任講師，讓學生不只學習AI技術本身，更能深入了解AI在實際工作場景中的應用方式，以及面對AI時代職場所需的心態與思維準備。"},
      {n:"07", tc:"00:05:49", s:349, text:"高專採用有一個特殊現象：學生透過學校推薦管道求職時，高達78%的機率會直接進入最初應徵的企業就職。這個比例遠高於一般大學求職市場，意味著企業若能提前建立與高專的關係，就能大幅提高錄用成功率。"},
      {n:"08", tc:"00:08:01", s:481, text:"2023年日本新設了一所市立私立高專，而富士通也對這所新設高專進行了資金出資。這顯示出大型科技企業不僅在既有高專招募人才，更積極從高專建立階段就介入投資，以確保未來的人才來源管道。"},
      {n:"09", tc:"00:08:24", s:504, text:"11家企業共同出資設立基金，以基金運用所產生的收益，讓高專學生的5年學費全面免費化。這樣的制度設計讓學生不必因為家庭經濟狀況而放棄就讀高專，能夠專注在技術學習上，真正實現不受財力限制的教育機會。"},
      {n:"10", tc:"00:09:36", s:576, text:"採訪過程中令人意外的發現之一，是高專畢業生與大學本科畢業生之間的薪資落差，在現實中依然存在。儘管高專生的技術能力獲得高度評價、求才熱度空前高漲，薪酬待遇的不平等問題卻尚未得到充分的改善與重視。"},
      {n:"11", tc:"00:09:55", s:595, text:"根據統計調查，高專與大學本科畢業生的終身薪資差距相當驚人：男性約為3600萬日圓，女性約為3800萬日圓，整體大約存在4000萬日圓左右的生涯所得落差。這個數字清楚揭示了當前學歷制度下的結構性不公平。"},
      {n:"12", tc:"00:11:19", s:679, text:"高專畢業生目前面臨的制度困境不僅限於薪資：他們完成了5年的高強度理工教育，卻連「學位」都無法取得。在現行學制框架下，高專生既非高中畢業、也非大學畢業，這種尷尬的定位使他們在就業市場上長期處於不平等的起跑點。"},
