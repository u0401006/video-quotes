<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流量週報 2026/03/22–03/28</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand:    #004E98;
    --brand-lt: #499BEA;
    --brand-dk: #315280;
    --bg:       #F4F7FC;
    --bg2:      #FFFFFF;
    --t1:       #232323;
    --t2:       #454545;
    --t3:       #595959;
    --gy1:      #666666;
    --gy2:      #9C9C9C;
    --gy3:      #CCCCCC;
    --gy4:      #E1E1E1;
    --gy5:      #F6F6F6;
    --up:       #34C759;
    --dn:       #AE1319;
    --radius:   10px;
  }

  body {
    font-family: "Microsoft JhengHei", "SF Pro TC", "PingFang TC", Arial, sans-serif;
    background: var(--bg);
    color: var(--t1);
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.3px;
  }

  /* ── HEADER ── */
  .header {
    background: var(--brand);
    color: #fff;
    padding: 28px 32px 24px;
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p  { font-size: 13px; opacity: .75; margin-top: 4px; }

  /* ── TABS ── */
  .tabs {
    background: var(--bg2);
    border-bottom: 1px solid var(--gy4);
    display: flex;
    padding: 0 32px;
    gap: 4px;
  }
  .tab-btn {
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 700;
    color: var(--gy1);
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--brand); }
  .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }

  /* ── CONTENT ── */
  .pane { display: none; padding: 28px 32px 48px; }
  .pane.active { display: block; }

  /* ── KPI CARDS ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 20px 22px;
    border: 1px solid var(--gy4);
  }
  .kpi-label { font-size: 12px; color: var(--gy1); text-transform: uppercase; letter-spacing: .8px; }
  .kpi-value { font-size: 28px; font-weight: 700; margin: 6px 0 4px; color: var(--t1); }
  .kpi-delta {
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border-radius: 12px;
  }
  .kpi-delta.up   { background: #EDFAF2; color: var(--up); }
  .kpi-delta.dn   { background: #FDECEA; color: var(--dn); }
  .kpi-delta.flat { background: var(--gy5); color: var(--gy1); }

  /* ── SECTION ── */
  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--brand-dk);
    text-transform: uppercase;
    letter-spacing: .7px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--gy4);
  }

  /* ── CHART CARD ── */
  .chart-card {
    background: var(--bg2);
    border: 1px solid var(--gy4);
    border-radius: var(--radius);
    padding: 20px;
  }
  .chart-toggles {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tog-btn {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--gy3);
    background: none;
    color: var(--gy1);
    cursor: pointer;
    transition: all .15s;
  }
  .tog-btn.on { border-color: var(--brand); color: var(--brand); background: #EAF2FC; }
  canvas { max-height: 280px; }

  /* ── TWO-COL GRID ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  /* ── SOURCES ── */
  .source-list { list-style: none; }
  .source-item {
    display: flex;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--gy5);
    gap: 10px;
  }
  .source-item:last-child { border-bottom: none; }
  .source-rank {
    font-size: 11px;
    font-weight: 700;
    color: var(--gy2);
    width: 22px;
    flex-shrink: 0;
    text-align: right;
  }
  .source-name { flex: 1; font-size: 13px; color: var(--t2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source-bar-wrap { width: 80px; height: 5px; background: var(--gy5); border-radius: 3px; flex-shrink: 0; }
  .source-bar { height: 100%; background: var(--brand-lt); border-radius: 3px; }
  .source-val { font-size: 12px; font-weight: 700; color: var(--t1); width: 52px; text-align: right; flex-shrink: 0; }

  /* ── ARTICLES ── */
  .article-list { list-style: none; }
  .article-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gy5);
    align-items: flex-start;
  }
  .article-item:last-child { border-bottom: none; }
  .article-rank {
    font-size: 13px;
    font-weight: 700;
    color: var(--gy3);
    width: 24px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .article-rank.top3 { color: var(--brand); }
  .article-title {
    flex: 1;
    font-size: 13px;
    line-height: 1.5;
    color: var(--t2);
  }
  .article-pv {
    font-size: 12px;
    font-weight: 700;
    color: var(--t1);
    white-space: nowrap;
    padding-top: 1px;
  }

  @media (max-width: 640px) {
    .header, .pane { padding: 20px 16px; }
    .tabs { padding: 0 8px; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .kpi-row .kpi:last-child { grid-column: span 2; }
    .two-col { grid-template-columns: 1fr; }
    .kpi-value { font-size: 22px; }
  }
</style>
</head>

// ─── HELPERS ────────────────────────────────────────────────────────────────
const fmt = n => n >= 1e6
  ? (n/1e6).toFixed(2) + 'M'
  : n >= 1e4
    ? (n/1e4).toFixed(1) + '萬'
    : n.toLocaleString();

const fmtRaw = n => n.toLocaleString();

const pct = (curr, prev) => {
  if (!prev) return { val: '—', cls: 'flat' };
  const p = ((curr - prev) / prev * 100);
  return {
    val: (p > 0 ? '+' : '') + p.toFixed(1) + '%',
    cls: p > 0 ? 'up' : p < 0 ? 'dn' : 'flat',
  };
};

const sum = (arr, key) => arr.reduce((a, b) => a + b[key], 0);

const charts = {};

// ─── BUILD PANE ─────────────────────────────────────────────────────────────
function buildPane(id) {
  const d = DATA[id];
  const pane = document.getElementById('pane-' + id);

  const currU = sum(d.traffic, 'users');
  const currS = sum(d.traffic, 'sessions');
  const currP = sum(d.traffic, 'pageviews');
  const prevU = sum(d.prev, 'users');
  const prevS = sum(d.prev, 'sessions');
  const prevP = sum(d.prev, 'pageviews');

  const du = pct(currU, prevU), ds = pct(currS, prevS), dp = pct(currP, prevP);
  const maxSrc = d.sources[0].users;

  pane.innerHTML = `
    <!-- KPI -->
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">使用者</div>
        <div class="kpi-value">${fmt(currU)}</div>
        <span class="kpi-delta ${du.cls}">${du.val} WoW</span>
      </div>
      <div class="kpi">
        <div class="kpi-label">工作階段</div>
        <div class="kpi-value">${fmt(currS)}</div>
        <span class="kpi-delta ${ds.cls}">${ds.val} WoW</span>
      </div>
      <div class="kpi">
        <div class="kpi-label">網頁瀏覽</div>
        <div class="kpi-value">${fmt(currP)}</div>
        <span class="kpi-delta ${dp.cls}">${dp.val} WoW</span>
      </div>
    </div>

    <!-- TRAFFIC TREND -->
    <div class="section">
      <div class="section-title">每日流量趨勢</div>
      <div class="chart-card">
        <div class="chart-toggles">
          <button class="tog-btn on" data-metric="users" data-chart="${id}">使用者</button>
          <button class="tog-btn" data-metric="sessions" data-chart="${id}">工作階段</button>
          <button class="tog-btn" data-metric="pageviews" data-chart="${id}">瀏覽量</button>
        </div>
        <canvas id="chart-line-${id}"></canvas>
      </div>
    </div>

    <!-- SOURCES + ARTICLES -->
    <div class="two-col">
      <div class="section">
        <div class="section-title">流量來源 Top 12</div>
        <div class="chart-card">
          <ul class="source-list">
            ${d.sources.slice(0,12).map((s, i) => `
              <li class="source-item">
                <span class="source-rank">${i+1}</span>
                <span class="source-name" title="${s.name}">${s.name}</span>
                <div class="source-bar-wrap"><div class="source-bar" style="width:${Math.round(s.users/maxSrc*100)}%"></div></div>
                <span class="source-val">${fmtRaw(s.users)}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      </div>

      <div class="section">
        <div class="section-title">熱門文章 Top 10</div>
        <div class="chart-card">
          <ul class="article-list">
            ${d.articles.map(a => `
              <li class="article-item">
                <span class="article-rank ${a.rank <= 3 ? 'top3' : ''}">${a.rank}</span>
                <span class="article-title">${a.title}</span>
                <span class="article-pv">${fmtRaw(a.pv)}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      </div>
    </div>
  `;

  // Line chart
  const labels = d.traffic.map(t => t.date);
  const metric = 'users';

  const ctx = document.getElementById('chart-line-' + id).getContext('2d');
  charts[id] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '本週',
          data: d.traffic.map(t => t[metric]),
          borderColor: d.color,
          backgroundColor: d.color + '18',
          borderWidth: 2.5,
          pointRadius: 4,
          pointBackgroundColor: d.color,
          tension: 0.35,
          fill: true,
        },
        {
          label: '上週',
          data: d.prev.map(t => t[metric]),
          borderColor: '#CCCCCC',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          pointRadius: 3,
          pointBackgroundColor: '#CCCCCC',
          borderDash: [4, 3],
          tension: 0.35,
          fill: false,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: { boxWidth: 14, font: { size: 12 } },
        },
        tooltip: {
          callbacks: {
            label: ctx => ' ' + ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString(),
          },
        },
      },
      scales: {
        x: {
          grid: { color: '#F0F0F0' },
          ticks: { font: { size: 12 } },
        },
        y: {
          grid: { color: '#F0F0F0' },
          ticks: {
            font: { size: 12 },
            callback: v => v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e4 ? (v/1e4).toFixed(0)+'萬' : v,
          },
        },
      },
    },
  });
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-metric]');
  if (!btn) return;
  const chartId = btn.dataset.chart;
  const metric  = btn.dataset.metric;
  const d = DATA[chartId];

  // update button states
  btn.closest('.chart-toggles').querySelectorAll('.tog-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  // update datasets
  const c = charts[chartId];
  const labelMap = { users:'使用者', sessions:'工作階段', pageviews:'網頁瀏覽' };
  c.data.datasets[0].data = d.traffic.map(t => t[metric]);
  c.data.datasets[0].label = '本週 ' + labelMap[metric];
  c.data.datasets[1].data = d.prev.map(t => t[metric]);
  c.data.datasets[1].label = '上週 ' + labelMap[metric];
  c.update();
});

// ─── TAB SWITCH ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const id = btn.dataset.pane;
    const pane = document.getElementById('pane-' + id);
    pane.classList.add('active');
    if (!pane.hasChildNodes()) buildPane(id);
  });
});

// ─── INIT ────────────────────────────────────────────────────────────────────
buildPane('cna');
</script>
</body>
