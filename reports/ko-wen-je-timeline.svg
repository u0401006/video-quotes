<svg width="1200" height="2560" viewBox="0 0 1200 2560" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1200" height="2560" fill="#F7F7F7"/>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <rect width="1200" height="232" fill="#829EA0"/>

  <!-- Header: decorative circle (left) -->
  <circle cx="177" cy="116" r="87" fill="#F0F4F4"/>
  <circle cx="177" cy="116" r="72" fill="#5A8286"/>
  <text x="177" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" letter-spacing="2">CNA</text>
  <text x="177" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.8">中央通訊社</text>

  <!-- Header: title -->
  <text x="308" y="78" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">Timeline of Cases Involving</text>
  <text x="308" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">Ex-Taipei Mayor Ko Wen-je</text>
  <text x="308" y="178" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.75">Cases spanning 2024–2025 · Source: CNA / Focus Taiwan</text>

  <!-- ═══════════════ TIMELINE SPINE ═══════════════ -->
  <rect x="216" y="258" width="8" height="2202" fill="#B9BBC2"/>

  <!-- ═══════════════ YEAR 2024 ═══════════════ -->
  <circle cx="220" cy="305" r="24" fill="white" stroke="#439FA6" stroke-width="2"/>
  <circle cx="220" cy="305" r="15" fill="#439FA6"/>
  <text x="258" y="314" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#232323">2024</text>

  <!-- ─── May 2 ─── -->
  <circle cx="220" cy="347" r="5" fill="#439FA6"/>
  <text x="260" y="351" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">May 2</text>
  <text x="260" y="373" font-family="Arial, sans-serif" font-size="14" fill="#454545">Ko Wen-je, former Taipei mayor and former leader of the opposition Taiwan People&#39;s Party, was listed</text>
  <text x="260" y="395" font-family="Arial, sans-serif" font-size="14" fill="#454545">as a suspect in alleged corruption cases involving the city&#39;s Core Pacific City development project</text>
  <text x="260" y="417" font-family="Arial, sans-serif" font-size="14" fill="#454545">and the Beitou Shilin Technology Park project.</text>

  <!-- ─── Aug. 12 ─── -->
  <circle cx="220" cy="455" r="5" fill="#439FA6"/>
  <text x="260" y="459" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Aug. 12</text>
  <text x="260" y="481" font-family="Arial, sans-serif" font-size="14" fill="#454545">Taipei prosecutors opened a separate investigation into Ko&#39;s political donations.</text>

  <!-- ─── Aug. 14 ─── -->
  <circle cx="220" cy="519" r="5" fill="#439FA6"/>
  <text x="260" y="523" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Aug. 14</text>
  <text x="260" y="545" font-family="Arial, sans-serif" font-size="14" fill="#454545">Prosecutors searched the office of MuKo Public Relations Marketing Ltd., a company linked to Ko, over</text>
  <text x="260" y="567" font-family="Arial, sans-serif" font-size="14" fill="#454545">alleged misuse of political expenses during the 2024 presidential election. Six individuals, including</text>
  <text x="260" y="589" font-family="Arial, sans-serif" font-size="14" fill="#454545">Ko&#39;s campaign finance chief Lee Wen-tsung, were brought in for questioning.</text>

  <!-- ─── Aug. 27 ─── -->
  <circle cx="220" cy="627" r="5" fill="#439FA6"/>
  <text x="260" y="631" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Aug. 27</text>
  <text x="260" y="653" font-family="Arial, sans-serif" font-size="14" fill="#454545">Prosecutors detained KMT Taipei City Councilor Ying Hsiao-wei as she allegedly attempted to leave</text>
  <text x="260" y="675" font-family="Arial, sans-serif" font-size="14" fill="#454545">the country.</text>

  <!-- ─── Aug. 28–30 ─── -->
  <circle cx="220" cy="713" r="5" fill="#439FA6"/>
  <text x="260" y="717" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Aug. 28&#8211;30</text>
  <text x="260" y="739" font-family="Arial, sans-serif" font-size="14" fill="#454545">Prosecutors searched locations linked to the Core Pacific Group and questioned Chairman Sheen Ching-jing.</text>
  <text x="260" y="761" font-family="Arial, sans-serif" font-size="14" fill="#454545">The Taipei District Court ordered Sheen, Ying and Ying&#39;s assistant Wu Shun-min to be detained</text>
  <text x="260" y="783" font-family="Arial, sans-serif" font-size="14" fill="#454545">incommunicado.</text>

  <!-- ─── Aug. 30–31 ─── -->
  <circle cx="220" cy="821" r="5" fill="#439FA6"/>
  <text x="260" y="825" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Aug. 30&#8211;31</text>
  <text x="260" y="847" font-family="Arial, sans-serif" font-size="14" fill="#454545">Authorities searched Ko&#39;s residence and questioned Ko and former Taipei Deputy Mayor Pong Cheng-sheng.</text>
  <text x="260" y="869" font-family="Arial, sans-serif" font-size="14" fill="#454545">Prosecutors later requested that both be detained incommunicado.</text>

  <!-- ─── Sept. 2 ─── -->
  <circle cx="220" cy="907" r="5" fill="#439FA6"/>
  <text x="260" y="911" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Sept. 2</text>
  <text x="260" y="933" font-family="Arial, sans-serif" font-size="14" fill="#454545">Pong was detained incommunicado.</text>

  <!-- ─── Sept. 5 ─── -->
  <circle cx="220" cy="971" r="5" fill="#439FA6"/>
  <text x="260" y="975" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Sept. 5</text>
  <text x="260" y="997" font-family="Arial, sans-serif" font-size="14" fill="#454545">Ko was detained incommunicado.</text>

  <!-- ─── Sept. 27–28 ─── -->
  <circle cx="220" cy="1035" r="5" fill="#439FA6"/>
  <text x="260" y="1039" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Sept. 27&#8211;28</text>
  <text x="260" y="1061" font-family="Arial, sans-serif" font-size="14" fill="#454545">Lee Wen-tsung and former Dingyue Development Corp. President Chu Yea-hu were detained incommunicado.</text>
  <text x="260" y="1083" font-family="Arial, sans-serif" font-size="14" fill="#454545">Prosecutors said Chu acted as a middleman for Sheen in lobbying city officials to raise the floor area</text>
  <text x="260" y="1105" font-family="Arial, sans-serif" font-size="14" fill="#454545">ratio of the Core Pacific City project in 2020.</text>

  <!-- ─── Oct. 25 ─── -->
  <circle cx="220" cy="1143" r="5" fill="#439FA6"/>
  <text x="260" y="1147" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Oct. 25</text>
  <text x="260" y="1169" font-family="Arial, sans-serif" font-size="14" fill="#454545">Prosecutors sought to extend Ko&#39;s detention and issued an arrest warrant for his secretary Hsu Chih-yu.</text>
  <text x="260" y="1191" font-family="Arial, sans-serif" font-size="14" fill="#454545">On Nov. 1, the court approved the extension. Ko did not appeal.</text>

  <!-- ─── Nov. 6 ─── -->
  <circle cx="220" cy="1229" r="5" fill="#439FA6"/>
  <text x="260" y="1233" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Nov. 6</text>
  <text x="260" y="1255" font-family="Arial, sans-serif" font-size="14" fill="#454545">The Taipei District Court approved the seizure of Core Pacific City land, prohibiting its disposal</text>
  <text x="260" y="1277" font-family="Arial, sans-serif" font-size="14" fill="#454545">during the seizure period.</text>

  <!-- ─── Nov. 14 ─── -->
  <circle cx="220" cy="1315" r="5" fill="#439FA6"/>
  <text x="260" y="1319" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Nov. 14</text>
  <text x="260" y="1341" font-family="Arial, sans-serif" font-size="14" fill="#454545">Authorities seized accounts linked to MuKo. Prosecutors alleged that Ko and Lee embezzled political</text>
  <text x="260" y="1363" font-family="Arial, sans-serif" font-size="14" fill="#454545">donations through the company and obtained court approval to freeze NT$38.83 million in related funds.</text>

  <!-- ─── Nov. 22 ─── -->
  <circle cx="220" cy="1401" r="5" fill="#439FA6"/>
  <text x="260" y="1405" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Nov. 22</text>
  <text x="260" y="1427" font-family="Arial, sans-serif" font-size="14" fill="#454545">Chu was released on bail of NT$2 million.</text>

  <!-- ─── Dec. 26 ─── -->
  <circle cx="220" cy="1465" r="5" fill="#439FA6"/>
  <text x="260" y="1469" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Dec. 26</text>
  <text x="260" y="1491" font-family="Arial, sans-serif" font-size="14" fill="#454545">Ko and 10 others were indicted on charges of bribery, embezzlement and breach of public trust in</text>
  <text x="260" y="1513" font-family="Arial, sans-serif" font-size="14" fill="#454545">connection with the Core Pacific City and political donation cases. Prosecutors sought a total sentence</text>
  <text x="260" y="1535" font-family="Arial, sans-serif" font-size="14" fill="#454545">of 28.5 years for Ko.</text>

  <!-- ─── Dec. 27 ─── -->
  <circle cx="220" cy="1573" r="5" fill="#439FA6"/>
  <text x="260" y="1577" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Dec. 27</text>
  <text x="260" y="1599" font-family="Arial, sans-serif" font-size="14" fill="#454545">The Taipei District Court ordered Ko and four other defendants released on bail ranging from NT$5 million</text>
  <text x="260" y="1621" font-family="Arial, sans-serif" font-size="14" fill="#454545">to NT$40 million. All were barred from leaving Taiwan.</text>

  <!-- ─── Dec. 29 ─── -->
  <circle cx="220" cy="1659" r="5" fill="#439FA6"/>
  <text x="260" y="1663" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Dec. 29</text>
  <text x="260" y="1685" font-family="Arial, sans-serif" font-size="14" fill="#454545">Prosecutors appealed the bail ruling, except in the case of Pong Cheng-sheng. The Taiwan High Court</text>
  <text x="260" y="1707" font-family="Arial, sans-serif" font-size="14" fill="#454545">rescinded the decision, prompting the lower court to raise the bail amounts.</text>

  <!-- ═══════════════ YEAR TRANSITION ARROW ═══════════════ -->
  <!-- Arrowhead pointing down, base y=1758, tip y=1798 -->
  <path d="M220 1798 L243 1758 L197 1758 Z" fill="#B9BBC2"/>

  <!-- ═══════════════ YEAR 2025 ═══════════════ -->
  <circle cx="220" cy="1838" r="24" fill="white" stroke="#439FA6" stroke-width="2"/>
  <circle cx="220" cy="1838" r="15" fill="#439FA6"/>
  <text x="258" y="1847" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#232323">2025</text>

  <!-- ─── Jan. 2 ─── -->
  <circle cx="220" cy="1880" r="5" fill="#439FA6"/>
  <text x="260" y="1884" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Jan. 2</text>
  <text x="260" y="1906" font-family="Arial, sans-serif" font-size="14" fill="#454545">The Taipei District Court reversed course and ordered Ko and three other defendants &#8212; Sheen Ching-jing,</text>
  <text x="260" y="1928" font-family="Arial, sans-serif" font-size="14" fill="#454545">Lee Wen-tsung and Ying Hsiao-wei &#8212; to be detained incommunicado.</text>

  <!-- ─── Jan. 23 ─── -->
  <circle cx="220" cy="1966" r="5" fill="#439FA6"/>
  <text x="260" y="1970" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Jan. 23</text>
  <text x="260" y="1992" font-family="Arial, sans-serif" font-size="14" fill="#454545">The court held its first preparatory hearing. Pong and former Taipei Urban Planning Commission executive</text>
  <text x="260" y="2014" font-family="Arial, sans-serif" font-size="14" fill="#454545">secretary Shao Hsiu-pei pleaded guilty, while Lee denied wrongdoing.</text>

  <!-- ─── March 4 ─── -->
  <circle cx="220" cy="2052" r="5" fill="#439FA6"/>
  <text x="260" y="2056" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">March 4</text>
  <text x="260" y="2078" font-family="Arial, sans-serif" font-size="14" fill="#454545">The court questioned Ying, who denied accepting bribes.</text>

  <!-- ─── March 20 ─── -->
  <circle cx="220" cy="2116" r="5" fill="#439FA6"/>
  <text x="260" y="2120" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">March 20</text>
  <text x="260" y="2142" font-family="Arial, sans-serif" font-size="14" fill="#454545">Ko appeared in court for the first time. He said accounting practices were &#8220;messy&#8221; but denied any intent</text>
  <text x="260" y="2164" font-family="Arial, sans-serif" font-size="14" fill="#454545">to embezzle and said he would not flee or collude with others.</text>

  <!-- ─── July 21 ─── -->
  <circle cx="220" cy="2202" r="5" fill="#439FA6"/>
  <text x="260" y="2206" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">July 21</text>
  <text x="260" y="2228" font-family="Arial, sans-serif" font-size="14" fill="#454545">The court granted bail to Sheen and Lee.</text>

  <!-- ─── Sept. 5 ─── -->
  <circle cx="220" cy="2266" r="5" fill="#439FA6"/>
  <text x="260" y="2270" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Sept. 5</text>
  <text x="260" y="2292" font-family="Arial, sans-serif" font-size="14" fill="#454545">The court granted bail to Ko and Ying.</text>

  <!-- ─── Sept. 12 ─── -->
  <circle cx="220" cy="2330" r="5" fill="#439FA6"/>
  <text x="260" y="2334" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Sept. 12</text>
  <text x="260" y="2356" font-family="Arial, sans-serif" font-size="14" fill="#454545">The High Court overturned the bail ruling and remanded the case for reconsideration.</text>

  <!-- ─── Sept. 15 ─── -->
  <circle cx="220" cy="2394" r="5" fill="#439FA6"/>
  <text x="260" y="2398" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#004E98">Sept. 15</text>
  <text x="260" y="2420" font-family="Arial, sans-serif" font-size="14" fill="#454545">The lower court upheld the original bail terms.</text>

  <!-- ═══════════════ TIMELINE END CAP ═══════════════ -->
  <circle cx="220" cy="2460" r="6" fill="#B9BBC2"/>

  <!-- ═══════════════ FOOTER ═══════════════ -->
  <line x1="60" y1="2490" x2="1140" y2="2490" stroke="#B9BBC2" stroke-width="1"/>

  <!-- CNA logo mark (simplified) -->
  <rect x="60" y="2506" width="3" height="28" fill="#439FA6"/>
  <text x="72" y="2524" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#595959">CNA</text>
  <text x="104" y="2524" font-family="Arial, sans-serif" font-size="13" fill="#9C9C9C">Central News Agency</text>

  <text x="1140" y="2524" font-family="Arial, sans-serif" font-size="12" fill="#9C9C9C" text-anchor="end">Focus Taiwan · focustaiwan.tw</text>

</svg>
