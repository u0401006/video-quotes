  {n:1, tc:"00:02:11", yt:131, text:"分析中國下一步行動的關鍵，是站在習近平的立場思考——不只是從華盛頓或東京的視角俯瞰中國，而是想像自己走進中南海的辦公室，看著他同一份情報儀表板，才能真正判斷他在什麼情況下會按下決策的按鈕。"},
