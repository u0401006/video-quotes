<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句 Gallery - Andrej Karpathy: From Vibe Coding to Agentic Engineering</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%); color: #f5f5f5; margin: 0; padding: 20px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { margin: 0 0 10px 0; font-size: 24px; color: #fff; }
        .header a { color: #4dabf7; text-decoration: none; }
        .header a:hover { text-decoration: underline; }
        .meta { color: #adb5bd; font-size: 14px; margin-top: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #343a40; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; text-decoration: none; display: block; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.4); }
        .card img { width: 100%; height: auto; display: block; }
        .card-body { padding: 15px; }
        .card-text { font-size: 15px; line-height: 1.5; color: #f8f9fa; margin: 0 0 10px 0; }
        .card-time { font-size: 12px; color: #adb5bd; }
        .footer { text-align: center; margin-top: 60px; padding-bottom: 20px; color: #6c757d; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Andrej Karpathy: From Vibe Coding to Agentic Engineering</h1>
        <div><a href="https://youtu.be/96jN2OCOfLs" target="_blank">📺 在 YouTube 上觀看影片</a></div>
        <div class="meta">共 30 句金句 | 語言：英文 → 繁中</div>
    </div>
    
    <div class="grid" id="gallery">
        <!-- Cards injected via JS -->
    </div>

    <div class="footer">
        Generated by OpenClaw Trend Scout 🤖
    </div>

    <script>
        fetch('summary.json')
            .then(response => response.json())
            .then(data => {
                const gallery = document.getElementById('gallery');
                data.quotes.forEach(q => {
                    const timecodeStart = q.timecode.split(' --> ')[0].split(',')[0];
                    const parts = timecodeStart.split(':');
                    const seconds = parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseInt(parts[2]);
                    const ytLink = `https://youtu.be/96jN2OCOfLs?t=${seconds}`;
                    
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = ytLink;
                    card.target = '_blank';
                    
                    card.innerHTML = `
                        <img src="${q.image}" alt="Quote thumbnail" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMjAiIGhlaWdodD0iMTgwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMmQyZDJkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjE0IiBmaWxsPSIjNmM3NTdkIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+SW1hZ2UgTm90IEF2YWlsYWJsZTwvdGV4dD48L3N2Zz4='">
                        <div class="card-body">
                            <p class="card-text">${q.tgt}</p>
                            <div class="card-time">⏱️ ${timecodeStart}</div>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            });
    </script>
</body>
</html>
