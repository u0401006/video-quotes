<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Quotes Gallery</title>
<style>
body { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; font-family: sans-serif; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.card { background: #0f3460; padding: 15px; border-radius: 8px; text-align: center; }
.card img { max-width: 100%; border-radius: 4px; cursor: pointer; }
.card p { margin-top: 10px; font-size: 0.9em; }
</style>
</head>
<body>
<h1>Video Quotes (azPBZSZdZsI)</h1>
<div class="grid" id="gallery"></div>
<script>
fetch('summary.json').then(r => r.json()).then(data => {
    const gallery = document.getElementById('gallery');
    data.forEach((q, i) => {
        const hms = q.timecode.split(' ')[0].split(',')[0];
        const parts = hms.split(':');
        const seconds = parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseInt(parts[2]);
        const url = `https://youtube.com/watch?v=azPBZSZdZsI&t=${seconds}s`;
        gallery.innerHTML += `<div class="card">
            <a href="${url}" target="_blank">
                <img src="kf_0${i+1}_annotated.jpg" alt="quote">
            </a>
            <p>${q.timecode}</p>
        </div>`;
    });
});
</script>
<p style="text-align:center;margin-top:40px;">Generated by OpenClaw</p>
</body>
</html>
